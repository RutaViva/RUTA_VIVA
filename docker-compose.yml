services:
  db:
    image: postgres:16
    container_name: rutaviva_postgres
    restart: always
    env_file:
      - ./.env
    ports:
      - "5438:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rutaviva_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rutaviva_network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq-telemetria
    hostname: rabbitmq-telemetria
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin1234
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rutaviva_network

  multiplier_api:
    build:
      context: ./services/multiplier_api
      dockerfile: Dockerfile
    container_name: rutaviva_multiplier_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:admin1234@db:5432/rutaviva_db
      - FRESHNESS_THRESHOLD_SECONDS=300
      - AUDITOR_API_KEY=auditor-secret-token
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rutaviva_network

  pressure_worker:
    build:
      context: ./services/pressure_worker
      dockerfile: Dockerfile
    container_name: rutaviva_pressure_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:admin1234@db:5432/rutaviva_db
      - RABBITMQ_URL=amqp://admin:admin1234@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rutaviva_network

  telemetry_simulator:
    build:
      context: ./services/telemetry_simulator
      dockerfile: Dockerfile
    container_name: rutaviva_telemetry_simulator
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:admin1234@db:5432/rutaviva_db
      - RABBITMQ_URL=amqp://admin:admin1234@rabbitmq:5672/
      - SILENT_VEHICLES_PCT=5.0
      - OUT_OF_CITY_PCT=3.0
      - DEFECT_DELAY_SECONDS=60
    volumes:
      - ./services/seed_cli/app/data/shapefiles:/app/data/shapefiles:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rutaviva_network

  request_simulator:
    build:
      context: ./services/request_simulator
      dockerfile: Dockerfile
    container_name: rutaviva_request_simulator
    restart: unless-stopped
    environment:
      - API_URL=http://multiplier_api:8000
      - REQUESTS_PER_SECOND=8.0
    depends_on:
      - multiplier_api
    networks:
      - rutaviva_network

  weather_worker:
    build:
      context: ./services/weather-api
      dockerfile: Dockerfile
    container_name: rutaviva_weather_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://admin:admin1234@db:5432/rutaviva_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rutaviva_network
      
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/sbin/start-master.sh
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Puerto del Spark Master
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - rutaviva_network

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
    depends_on:
      - spark-master
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - rutaviva_network

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter-pyspark
    ports:
      - "8888:8888" # Web UI de Jupyter Notebook
    volumes:
      - .:/home/jovyan/work
    networks:
      - rutaviva_network
    environment:
      - JUPYTER_ENABLE_LAB=yes

volumes:
  pg_data:
  rabbitmq_data:

networks:
  rutaviva_network:
    driver: bridge