[project]
name = "rutaviva"
version = "0.1.0"
description = "Plataforma de datos para tarifas dinámicas y operación de flota RutaViva"
readme = "README.md"
authors = [
    { name = "barrera-daniel-jpg", email = "barreradb77@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.1",
    "alembic>=1.20.0",
    "faker>=40.41.0",
    "fastapi>=0.110.0",
    "geopandas>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
rutaviva = "rutaviva:main"

[build-system]
requires = ["uv_build>=0.12.21"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "services/telemetry_simulator/app",
    "services/multiplier_api",
    "services/multiplier_api/app",
    "services/pressure_worker/app",
    "services/seed_cli/app",
    "services/request_simulator/app",
]
